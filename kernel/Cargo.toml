[package]
name = "sprout-kernel"
description = "Sprout: an AI-native capability microkernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sprout-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Build the test kernel: runs every `ktest!` and exits QEMU with the result.
ktest = []

# Kernel dependencies need an ADR (ADR-0001).
[dependencies]
# The ABI shared with userspace: syscall numbers, errors, rights, schema.
sprout-abi = { path = "../lib/sprout-abi" }
# Kernel heap (ADR-0006). Locking is ours, so no default features.
linked_list_allocator = { version = "0.10", default-features = false }
