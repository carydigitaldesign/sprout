name: ci

on:
  push:
  pull_request:

jobs:
  kernel:
    name: ${{ matrix.arch }} lint, test, loc
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, x86_64]
    steps:
      - uses: actions/checkout@v5

      # rustup reads rust-toolchain.toml and installs the pinned toolchain,
      # components and both bare-metal targets.
      - name: Install Rust toolchain
        run: rustup show

      # Newer Ubuntu splits QEMU per architecture (qemu-system-riscv) and
      # leaves qemu-system-misc as a shell; older ones only have the latter.
      # The riscv64 machine boots with `-bios default`, which is OpenSBI,
      # a Recommends we skip, so it is named explicitly.
      - name: Install QEMU
        run: |
          sudo apt-get update
          case "${{ matrix.arch }}" in
            riscv64)
              if apt-cache show qemu-system-riscv >/dev/null 2>&1; then
                pkgs="qemu-system-riscv opensbi"
              else
                pkgs="qemu-system-misc opensbi"
              fi ;;
            x86_64) pkgs="qemu-system-x86" ;;
          esac
          sudo apt-get install -y --no-install-recommends $pkgs
          qemu-system-${{ matrix.arch }} --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Lint (SAFETY comments)
        run: cargo xtask lint --arch ${{ matrix.arch }}

      - name: Boot and run kernel tests
        run: cargo xtask test --arch ${{ matrix.arch }} --timeout 180

      # Only riscv64 has a network device (virtio-mmio); x86_64 needs
      # virtio-pci first.
      - name: Talk to the in-OS MCP server from the host
        if: matrix.arch == 'riscv64'
        run: cargo xtask mcp-check

      - name: Line counts
        run: cargo xtask loc --arch ${{ matrix.arch }}

  # A BIOS-bootable ISO of the x86_64 kernel (tools/mkiso.sh), booted once
  # from the ISO to prove it, then attached as a downloadable artifact.
  iso:
    name: x86_64 bootable ISO
    runs-on: ubuntu-latest
    needs: kernel
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show

      - name: Install GRUB tools and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends grub-pc-bin xorriso mtools qemu-system-x86

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build the ISO
        run: tools/mkiso.sh --release sprout-x86_64.iso

      - name: Boot the ISO in QEMU and wait for init
        run: |
          qemu-system-x86_64 -cdrom sprout-x86_64.iso -m 128M -smp 1             -display none -serial stdio -monitor none -no-reboot > boot.log &
          qemu=$!
          for i in $(seq 1 90); do
            if grep -q 'init done, ok=true' boot.log; then break; fi
            sleep 1
          done
          kill $qemu || true
          tail -n 20 boot.log
          grep -q '"event":"boot".*"arch":"x86_64"' boot.log
          grep -q 'init done, ok=true' boot.log

      - uses: actions/upload-artifact@v4
        with:
          name: sprout-x86_64-iso
          path: sprout-x86_64.iso
          if-no-files-found: error
